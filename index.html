  <body>
    <style>
      #loading-skeleton {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      @media (min-width: 768px) {
        #loading-skeleton {
          display: none !important;
        }
      }
      #loading-skeleton.loaded {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 55px;
        height: 55px;
        border: 4px solid rgba(255, 53, 53, 0.3);
        border-top-color: #F9221C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        animation-play-state: running !important;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      body.loading *:not(.spinner) {
        animation-play-state: paused !important;
        transition: none !important;
      }
    </style>
    <div id="loading-skeleton">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const isMobile =
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent
        ) || window.innerWidth < 768;

      if (isMobile) {
        // Agregar clase loading al body
        document.body.classList.add("loading");

        const criticalResources = [
          "/images/logo-fertex.webp",
          "/images/fondo-inicio.webp",
          "/fonts/Poppins/Poppins-Regular.woff2",
          "/fonts/Poppins/Poppins-SemiBold.woff2",
          "/fonts/Poppins/Poppins-Medium.woff2",
          "/fonts/SairaStencilOne/SairaStencilOne-Regular.woff2",
        ];

        let resourcesLoaded = {
          dom: false,
          fonts: false,
          images: false,
          react: false,
        };

        function checkAllResourcesLoaded() {
          if (
            resourcesLoaded.dom &&
            resourcesLoaded.fonts &&
            resourcesLoaded.images &&
            resourcesLoaded.react
          ) {
            hideLoadingSkeleton();
          }
        }

        function hideLoadingSkeleton() {
          document.body.classList.remove("loading");

          const skeleton = document.getElementById("loading-skeleton");
          if (skeleton) {
            skeleton.classList.add("loaded");
            setTimeout(() => {
              skeleton.remove();
            }, 300);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => {
            resourcesLoaded.dom = true;
            checkAllResourcesLoaded();
          });
        } else {
          resourcesLoaded.dom = true;
        }

        if (document.fonts) {
          document.fonts.ready.then(() => {
            resourcesLoaded.fonts = true;
            checkAllResourcesLoaded();
          });
        } else {
          setTimeout(() => {
            resourcesLoaded.fonts = true;
            checkAllResourcesLoaded();
          }, 1000);
        }

        function checkCriticalImages() {
          const logoImage = new Image();
          logoImage.src = "/images/logo-fertex.webp";

          const heroImage = new Image();
          heroImage.src = "/images/fondo-inicio.webp";

          let imagesChecked = 0;
          const totalImages = 2;

          function imageLoaded() {
            imagesChecked++;
            if (imagesChecked === totalImages) {
              resourcesLoaded.images = true;
              checkAllResourcesLoaded();
            }
          }

          // Verificar ambas imágenes webp
          logoImage.onload = imageLoaded;
          logoImage.onerror = imageLoaded;

          heroImage.onload = imageLoaded;
          heroImage.onerror = imageLoaded;
        }

        const observer = new MutationObserver((mutations) => {
          const root = document.getElementById("root");
          if (root && root.children.length > 0) {
            resourcesLoaded.react = true;
            observer.disconnect();
            checkAllResourcesLoaded();
          }
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => {
            const root = document.getElementById("root");
            if (root) {
              observer.observe(root, { childList: true, subtree: true });
            }
            checkCriticalImages();
          });
        } else {
          const root = document.getElementById("root");
          if (root) {
            if (root.children.length > 0) {
              resourcesLoaded.react = true;
            } else {
              observer.observe(root, { childList: true, subtree: true });
            }
          }
          checkCriticalImages();
        }

        setTimeout(() => {
          hideLoadingSkeleton();
        }, 5000);
      } else {
        document.getElementById("loading-skeleton")?.remove();
      }
    </script>
  </body>
